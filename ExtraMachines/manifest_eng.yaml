patcher_version_requirement: "3.0.6"
no_base_content: false

compatible_patch_versions: true
strict_requirements: false

data_dirs:
  - "general"
merge_instructions:
  - "merge_general.yaml"

# options_base_dir: "options"
 
prerequisites:
  - name: [community_remaster]
    versions:
     - ">=1.14.1"
    optional_content:
      - hd_vehicle_models
      - english_localization

optional_content:
  - name: workshops
    display_name: The cars are on sale and spawn.
    description: |
      Adds new cars and parts for sale, as well as adding new cars to enemy spawn.
    data_dirs:
      - "comrem"
    merge_instructions:
      - "merge_comrem.yaml"
      - "merge_workshops.yaml"
  - name: english_localization
    display_name: English Localization
    forced_option: True
    data_dirs:
      - "fakedir"
    merge_instructions:
      - "merge_strings_eng.yaml"
    description: |
      Full text localization of Extra Machines.
