name: ExtraMachines_NEKTO
 
version: "2.1.0"
build: "260917a"
language: ru
display_name: Extra Machines [NEKTO]
authors: Spok, OverLine
description: |
  Extra Machines - аддон ассет-пак, добавляющий новые машины в оригинальную Ex Machina. Основная версия мода является адаптированной для полноценной игры, наиболее подходящие для игрока машины могут быть приобретены в городах, а остальные могут быть получены только с помощью читов (exm_car(1) - exm_car(17)).
  Все машины в паке были созданы специально для Ex Machina, а не являются портами из других игр, как в многих других модах. Мод является беспрецедентным по уровню качества добавляемых машин, разнообразию доступных кабин и кузовов, наличию модели повреждений у всех играбельных машин, по сути, идеально вписываясь в игру на одном уровне с оригинальными машинами, сделанными Targem Games.

release_date: "23.04.2024"
link: https://github.com/lineisover/ExtraMachinesCP
logo: assets/logo_nekto.png
install_banner: assets/banner_nekto.png
tags: [vehicles]
change_log: assets/changelog.md
screenshots:
  - img: assets/Rednek/1.jpg
    text: | 
      Плеб - Базовая кабина для Рэднэка. Говорят, ее можно продырявить плевком.
      Рустикана - Родной кузов Рэднека. Обязательно запирайте заднюю дверь, а то украдут что внутри.
  - img: assets/Rednek/2.jpg
    text: |
      Кантри - Кустарная модификация базовой кабины, скорее всего сделана знакомым механиком за чарочку чего-нибудь по-крепче.
      Урбана - Родной кузов Рэднека. Обязательно запирайте заднюю дверь, а то украдут что внутри.
  - img: assets/Rednek/3.jpg
    text: |
      Хэдмен - Поздняя модель кабины Рэднека, в целом держится хорошо.
      Капитус - Кузов для кемпинга где-нибудь в отдалённой глуши. Часто используется исследователями.
  - img: assets/Rednek/4.jpg
    text: |
      Хэдмен - Поздняя модель кабины Рэднека, в целом держится хорошо.
      Палатий - Лучший кузов для Рэднека. Места в нём, увы, немного, но это с лихвой компенсируется его бронированностью.
  - img: assets/Tornado/2.jpg
    text: |
      Ураган - Лёгкая и с мощным двигателем, но слабым вооружением. Любителям легкой наживы сгодится.
      Багажник - Простой кузов, минимум места для багажа. Совершенно не подходит для торговли.
  - img: assets/Tornado/3.jpg
    text: |
      Шкипер - Пожертвовав внешним видом и толикой скорости получилось нечто среднее между престижным авто и ведром.
      Баржа - Модификация стандартного кузова. Имеет больше брони и дополнительные места по бокам.
  - img: assets/Tornado/4.jpg
    text: |
      Несмертный - Вы когда-нибудь пытались сделать из консервной банки пулемет? Вот это оно самое, но кабина.
      Аполлон - Для мирной поры это, и в самом деле, бронированный кузов. В реальном бою этого будет недостаточно.
  - img: assets/Tornado/1.jpg
    text: |
      Ураган (гоночный) - Цивильная кабина без оружия, предназначена исключительно для гонок.
      Багажник - Простой кузов, минимум места для багажа. Совершенно не подходит для торговли.
  - img: assets/Traktor/1.jpg
    text: |
      Трёхсотник - Кабина для фермерских нужд. Внутри - стойкий запах земли, солярки, и жаренной картошки. Говорят, что название происходит из древней байки, но из какой именно - никто не знает.
      Контейнер трактора - Стандартный контейнер трактора.
  - img: assets/Traktor/2.jpg
    text: |
      Богатырь - Идеально подходит для проведения работ по сносу тех немногих зданий старого мира, что еще стоят.
      Ковш - Стандартный ковш трактора.
  - img: assets/Traktor/3.jpg
    text: |
      Киров - Фермерский городок, который смог позволить себе такую вариацию трактора, автоматически становится местным центром.
      Большой ковш - Увеличенный ковш трактора.
  - img: assets/M35/1.jpg
    text: |
      Прайвет - Старая армейская кабина. Ни удобств, ни, что странно, нормального вооружения. Амбициозный водитель заменит её при первой же возможности.
      Лонгхуд - Слабозащищенный кузов закрытый прохудившимся брезентом.
  - img: assets/M35/2.jpg
    text: |
      Бивер - Более поздняя модель кабины Чиф Берта. Превосходит Прайвет по всем характеристикам.
      Вэрхауз - Очень вместительный и неплохо защищенный кузов. Чаще всего используется предпринимателями для транспортировки рабочих.
  - img: assets/M35/3.jpg
    text: |
      Феллоу Чад - Тяжеломодифицированная кабина последнего поколения. Прекрасно вооружена и защищена.
      Форкасл - Несмотря на внушительные размеры, этот кузов не может похвастаться большой вместительностью.
  - img: assets/M35/4.jpg
    text: |
      Битлбас - Очень неординарная кабина. Имеет мирный, безобидный вид... И гнёзда для тяжелого вооружения. Чаще всего используется исследователями в виду этих особенностей.
      Ейтиз - Несмотря на цивильную внешность обладает лучшим бронированием.
  - img: assets/Cumbine/1.jpg
    text: |
      Кабина - Кабина Кумбайна. Ни больше, ни меньше.
      Контейнер - Стандартный контейнер Кумбайна.

translations: [eng]
# variants: [isl, nekto]

patcher_version_requirement: "3.0.6"
no_base_content: false

compatible_patch_versions: true

data_dirs:
  - "general"
merge_instructions:
  - "merge_general.yaml"
  - "merge_strings_rus.yaml"
  - "merge_nekto_general.yaml"
  - "merge_nekto_strings_ru.yaml"

# options_base_dir: "options_nekto"
 
prerequisites:
  - name: [community_remaster]
    versions:
     - ">=1.14.1"
    optional_content:
      - hd_vehicle_models
  - name: [nekto_mod_comrem]
    versions:
     - ">=5.2"

incompatible:
  - name: nekto_mod_comrem
    versions: []
    optional_content:
    - english_update
  - name: improved_storyline_hd
    versions: []
    optional_content: []

optional_content:
  - name: workshops
    display_name: Машины в продаже и спауне.
    description: |
      Добавляет в продажу новые машины и запчасти, а так же добавляет новые машины в спаун врагов.
    data_dirs:
      - "comrem"
    merge_instructions:
      - "merge_comrem.yaml"
      - "merge_workshops.yaml"
      - "merge_nekto_workshops.yaml"
